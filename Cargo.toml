[package]
name = "Embers"
version = "0.1.0"
authors = ["Maxsh001"]
edition = "2024"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
bevy = { version = "0.17", features = ["dynamic_linking"] }
avian3d = "0.4"
bevy-tnua = "0.26"
bevy-tnua-avian3d = "0.8"
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
regex = "1.12"
rand = "0.9"
thiserror = "2.0"
