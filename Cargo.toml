[workspace]
members = [
    "embers",
    "embers-macros",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Maxsh001"]
edition = "2024"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
codegen-units = 1
lto = "thin"

[workspace.dependencies]
avian3d = "0.4"
bevy = { version = "0.17", features = [] }
bevy-tnua = "0.26"
bevy-tnua-avian3d = "0.8"
image = { version = "0.25", default-features = false }
winit = { version = "0.30", default-features = false }
duplicate = "2.0"
rand = "0.9"
regex = "1.12"
thiserror = "2.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[workspace.dev-dependencies]
bevy = { version = "0.17", features = ["dynamic_linking"] }
